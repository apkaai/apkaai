<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Purple background with large rounded corners matching the 3D image -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B35D6"/>
      <stop offset="100%" style="stop-color:#6B21A8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Rounded square -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>

  <!-- Letter A — bold, wide, no serifs, open bottom -->
  <!-- Left leg, right leg, crossbar, open at bottom centre -->
  <path d="
    M 32 168
    L 76 36
    H 124
    L 168 168
    H 140
    L 132 146
    H 68
    L 60 168
    Z

    M 76 122
    H 124
    L 100 62
    Z
  " fill="white" fill-rule="evenodd"/>

  <!-- Lightning bolt — sits inside the open triangle of A -->
  <!-- Top-right to bottom-left, compact, inside A's inner triangle -->
  <path d="
    M 118 58
    L 96 96
    H 110
    L 86 138
    L 126 92
    H 112
    Z
  " fill="white"/>
</svg>
